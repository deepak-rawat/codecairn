name: CodeCairn build and test

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        description: Immutable source revision to build
        type: string
        default: ""
      release-tag:
        description: Validated version tag; enables standalone packaging
        type: string
        default: ""

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Prepare pinned source and public recipes
        run: |
          cmake -P packaging/PrepareSource.cmake
          cmake -P packaging/PrepareRecipes.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: codecairn-source-recipes
          path: |
            build/releases/*-source.tar.gz*
            build/releases/homebrew/
            build/releases/arch/PKGBUILD
            build/releases/msys2/PKGBUILD
          if-no-files-found: error

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Install build dependencies
        run: brew install cmake ninja qt tree-sitter sqlite re2 llvm
      - name: Configure
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCODECAIRN_RELEASE=ON -DCODECAIRN_BUNDLE_RUNTIME=ON -DBUILD_TESTING=ON \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix qt);$(brew --prefix tree-sitter);$(brew --prefix sqlite);$(brew --prefix re2);$(brew --prefix llvm)"
      - name: Build and test
        run: |
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure
      - name: Preserve failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-macos
          path: |
            build/release/*-results.*
            build/release/Testing/Temporary/
      - name: Preserve matching application symbols
        if: inputs.release-tag != ''
        run: |
          mkdir -p build/symbols
          dsymutil build/release/codecairn.app/Contents/MacOS/codecairn -o build/symbols/codecairn.dSYM
          dsymutil build/release/cairn -o build/symbols/cairn.dSYM
      - uses: actions/upload-artifact@v4
        if: inputs.release-tag != ''
        with:
          name: symbols-codecairn-macos
          path: build/symbols/
          if-no-files-found: error
      - name: Package standalone DMG
        if: inputs.release-tag != ''
        run: cpack --config build/release/CPackConfig.cmake -B build/releases/standalone
      - name: Verify mounted standalone package without Homebrew paths
        if: inputs.release-tag != ''
        run: |
          set -euo pipefail
          images=(build/releases/standalone/*.dmg)
          [[ ${#images[@]} == 1 ]]
          mount="$RUNNER_TEMP/codecairn-mounted"
          mkdir -p "$mount"
          hdiutil attach "${images[0]}" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          cmake "-DAPP=$mount/codecairn.app" \
            "-DVERSION=$(sed -n 's/^    VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)" \
            "-DTEST_DIRECTORY=$RUNNER_TEMP/codecairn-runtime" \
            -P packaging/VerifyMacOSRuntime.cmake
      - uses: actions/upload-artifact@v4
        if: inputs.release-tag != ''
        with:
          name: codecairn-macos
          path: build/releases/standalone/*.dmg*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-libtree-sitter
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-re2
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-clang-tools-extra
      - name: Configure, build, and test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCODECAIRN_RELEASE=ON -DCODECAIRN_BUNDLE_RUNTIME=ON -DBUILD_TESTING=ON
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure
      - name: Preserve failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-windows
          path: |
            build/release/*-results.*
            build/release/Testing/Temporary/
      - uses: actions/upload-artifact@v4
        if: inputs.release-tag != ''
        with:
          name: symbols-codecairn-windows
          path: build/release/bin/*.exe
          if-no-files-found: error
      - name: Package and verify extracted standalone ZIP
        if: inputs.release-tag != ''
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cpack --config build/release/CPackConfig.cmake -B build/releases/standalone
          archives=(build/releases/standalone/*.zip)
          [[ ${#archives[@]} == 1 ]]
          archive=$(cygpath -m "${archives[0]}")
          root=$(cygpath -m "$RUNNER_TEMP/codecairn-extracted")
          mkdir -p "$root"
          cmake -E chdir "$root" cmake -E tar xf "$archive"
          cmake "-DEXECUTABLE=$root/bin/codecairn.exe" \
            "-DCLANG_RESOURCE_DESTINATION=$root/lib/clang" \
            "-DOBJDUMP=$(cygpath -m "$(command -v objdump)")" \
            "-DEXPECTED_VERSION=$(sed -n 's/^    VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)" \
            "-DTEST_DIRECTORY=$root/runtime-check" -P packaging/VerifyWindowsRuntime.cmake
      - uses: actions/upload-artifact@v4
        if: inputs.release-tag != ''
        with:
          name: codecairn-windows
          path: build/releases/standalone/*.zip*
          if-no-files-found: error

  homebrew:
    needs: source
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: codecairn-source-recipes
          path: build/releases
      - name: Build and test source-only formula
        run: |
          cmake -DCOMMIT_TAP=ON "-DLOCAL_ROOT=$RUNNER_TEMP/codecairn-local" \
            -P packaging/PrepareLocalTap.cmake
          brew tap local/releases "$RUNNER_TEMP/codecairn-local/tap"
          brew install --build-from-source local/releases/codecairn
          brew test local/releases/codecairn

  msys2:
    needs: source
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codecairn-source-recipes
          path: build/releases
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel git mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-libtree-sitter mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-re2 mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-clang-tools-extra
      - name: Build and validate managed UCRT64 package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cp build/releases/*-source.tar.gz build/releases/msys2/
          cd build/releases/msys2
          makepkg-mingw --syncdeps --noconfirm --cleanbuild
          pacman -U --noconfirm ./*.pkg.tar.zst
          cairn --version
          QT_QPA_PLATFORM=offscreen codecairn --version
          for package in ./*.pkg.tar.zst; do
            if bsdtar -tf "$package" | grep -Ei '\.dll$|qt\.conf$|/lib/clang/'; then
              echo "Managed package contains private runtime dependencies" >&2
              exit 1
            fi
            sha256sum "$(basename "$package")" > "$package.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: codecairn-msys2
          path: build/releases/msys2/*.pkg.tar.zst*
          if-no-files-found: error

  arch:
    needs: source
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install native build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git cmake ninja qt6-base qt6-5compat \
            tree-sitter sqlite re2 clang llvm-libs namcap ttf-dejavu
          useradd -m builder
      - uses: actions/download-artifact@v4
        with:
          name: codecairn-source-recipes
          path: build/releases
      - name: Build, test, and validate managed Arch package
        shell: bash
        run: |
          set -euo pipefail
          cp build/releases/*-source.tar.gz build/releases/arch/
          chown -R builder:builder build/releases/arch
          cd build/releases/arch
          runuser -u builder -- makepkg --cleanbuild --noconfirm
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
          namcap PKGBUILD ./*.pkg.tar.zst
          pacman -U --noconfirm ./*.pkg.tar.zst
          cairn --version
          QT_QPA_PLATFORM=offscreen codecairn --version
          for package in ./*.pkg.tar.zst; do
            if bsdtar -tf "$package" | grep -E '/lib/clang/|qt\.conf$|\.so(\.|$)'; then
              echo "Managed package contains private runtime dependencies" >&2
              exit 1
            fi
            sha256sum "$(basename "$package")" > "$package.sha256"
          done
      - name: Preserve failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-arch
          path: |
            build/releases/arch/src/build/*-results.*
            build/releases/arch/src/build/Testing/Temporary/
      - uses: actions/upload-artifact@v4
        with:
          name: codecairn-arch
          path: |
            build/releases/arch/*.pkg.tar.zst*
            build/releases/arch/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
