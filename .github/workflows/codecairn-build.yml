name: CodeCairn build and test

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        description: Immutable source revision to build
        type: string
        default: ""
      release-tag:
        description: Validated release tag; enables standalone packaging
        type: string
        default: ""

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Prepare pinned source and public recipes
        run: |
          cmake -P packaging/PrepareSource.cmake
          cmake -P packaging/PrepareRecipes.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: codecairn-source-recipes
          path: |
            build/releases/*-source.tar.gz*
            build/releases/homebrew/
            build/releases/arch/PKGBUILD
            build/releases/msys2/PKGBUILD
          if-no-files-found: error

  unix:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config patchelf \
            libsqlite3-dev libre2-dev clang clangd libclang-dev llvm-dev \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 fonts-dejavu-core
      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'Linux'
        with:
          version: "6.8.3"
          modules: "qt5compat"
          cache: true
      - name: Prepare pinned Linux runtime dependency
        if: runner.os == 'Linux'
        run: |
          cmake "-DOUTPUT=$RUNNER_TEMP/codecairn-linux-deps" \
            -P cmake/PrepareLinuxDependencies.cmake
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja qt tree-sitter sqlite re2 llvm
      - name: Configure
        run: |
          args=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            args+=("-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR;$RUNNER_TEMP/codecairn-linux-deps")
          fi
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCODECAIRN_RELEASE=ON -DCODECAIRN_BUNDLE_RUNTIME=ON \
            -DBUILD_TESTING=ON -DCODECAIRN_BUILD_BENCHMARKS=OFF "${args[@]}"
      - name: Build and test
        run: |
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure
      - name: Preserve failed test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            build/release/*-results.*
            build/release/Testing/Temporary/
      - name: Preserve matching macOS symbols
        if: inputs.release-tag != '' && runner.os == 'macOS'
        run: |
          mkdir -p build/symbols
          dsymutil build/release/codecairn.app/Contents/MacOS/codecairn -o build/symbols/codecairn.dSYM
          dsymutil build/release/cairn -o build/symbols/cairn.dSYM
      - uses: actions/upload-artifact@v4
        if: inputs.release-tag != '' && runner.os == 'macOS'
        with:
          name: symbols-codecairn-macos
          path: build/symbols/
          if-no-files-found: error
      - name: Package standalone application
        if: inputs.release-tag != ''
        run: cpack --config build/release/CPackConfig.cmake -B build/releases/standalone
      - uses: actions/upload-artifact@v4
        if: inputs.release-tag != ''
        with:
          name: ${{ runner.os == 'Linux' && 'codecairn-linux' || 'codecairn-macos' }}
          path: |
            build/releases/standalone/*.dmg*
            build/releases/standalone/*.tar.gz*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel git mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-libtree-sitter mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-re2 mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-clang-tools-extra
      - name: Configure, build, and test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCODECAIRN_RELEASE=ON -DCODECAIRN_BUNDLE_RUNTIME=ON \
            -DBUILD_TESTING=ON -DCODECAIRN_BUILD_BENCHMARKS=OFF
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure
      - name: Preserve failed test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-windows
          path: |
            build/release/*-results.*
            build/release/Testing/Temporary/
      - uses: actions/upload-artifact@v4
        if: inputs.release-tag != ''
        with:
          name: symbols-codecairn-windows
          path: build/release/bin/*.exe
          if-no-files-found: error
      - name: Package standalone ZIP
        if: inputs.release-tag != ''
        shell: msys2 {0}
        run: cpack --config build/release/CPackConfig.cmake -B build/releases/standalone
      - uses: actions/upload-artifact@v4
        if: inputs.release-tag != ''
        with:
          name: codecairn-windows
          path: build/releases/standalone/*.zip*
          if-no-files-found: error
